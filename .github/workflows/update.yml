name: Autonomous Weekly Fantasy Refresh

# All cron times are UTC. Window: Tuesday 5 AM ET (after Monday Night Football) through Sunday 1 PM ET (kickoff).
# GitHub drops or delays scheduled runs, especially at :00 and :30, so this fires every 15 minutes at odd
# minutes. If a run is skipped, the next one picks up the same data. A run already in progress is never cancelled.
on:
  schedule:
    - cron: '7,22,37,52 9-23 * * 2'
    - cron: '7,22,37,52 * * * 3-6'
    - cron: '7,22,37,52 0-17 * * 0'
  workflow_dispatch:

concurrency:
  group: fantasy-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Build Script (retries if the data source hiccups)
        id: b
        env:
          SGO_KEY: ${{ secrets.SGO_KEY }}
          REQUIRE_SCHEDULE: '1'
        # If the free data source is down (it was for about 2 hours on Nov 8), don't fail and send alert emails:
        # skip this round, keep the last published site, and the next run tries again in 15 minutes.
        run: |
          if python build.py 2>&1 | tee /tmp/b.log; [ "${PIPESTATUS[0]}" = 0 ] || (sleep 45 && python build.py 2>&1 | tee /tmp/b.log; [ "${PIPESTATUS[0]}" = 0 ]) || (sleep 90 && python build.py 2>&1 | tee /tmp/b.log; [ "${PIPESTATUS[0]}" = 0 ]); then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          elif grep -qE "HTTP Error 5[0-9][0-9]|Gateway Time-out|timed out|Connection reset|RemoteDisconnected" /tmp/b.log; then
            echo "Data source is down right now. Keeping the last published site; the next run will try again."
          else
            echo "Build failed for a reason other than the data source being down."
            exit 1
          fi

      - name: Add the domain move, Google tags, robots.txt and sitemap (keep this step)
        if: steps.b.outputs.ok == '1'
        run: python site_extras.py

      - name: Player, rankings and start/sit pages for Google (about once an hour; keep these steps)
        if: steps.b.outputs.ok == '1'
        # Makes no API calls: it only reads the page build.py just made. If it fails, runs long or it isn't
        # its turn, the next step keeps the last published pages and the site still publishes normally.
        continue-on-error: true
        timeout-minutes: 18
        run: |
          if [ "$(date -u +%M)" -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install playwright==1.63.0
            python -m playwright install chromium || python -m playwright install --with-deps chromium
            python seo_pages.py
          else
            echo "Not this run's turn; keeping the last player pages."
          fi

      - name: Keep the last good Google pages if this run didn't make new ones (keep this step)
        if: always() && steps.b.outputs.ok == '1'
        run: |
          rm -rf public/_seo_tmp
          keep=""
          [ -d public/players ] || keep="players rankings a trade compare team insights sitemap.xml"
          [ -f public/start-data.json ] || keep="$keep start-data.json sitemap-start.xml _worker.js _routes.json"
          if [ -n "$keep" ]; then
            git fetch --depth 1 origin gh-pages || true
            for x in $keep; do
              git archive FETCH_HEAD "$x" 2>/dev/null | tar -x -C public 2>/dev/null || echo "Nothing earlier to keep for $x"
            done
          fi
          ls public | head -40

      - name: Check the page is real before publishing
        if: steps.b.outputs.ok == '1'
        run: |
          test -s public/index.html
          size=$(wc -c < public/index.html)
          echo "index.html is $size bytes"
          test "$size" -gt 300000

      - name: Deploy to GitHub Pages
        if: steps.b.outputs.ok == '1'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true   # keep only the latest published copy so the branch doesn't grow with every update

      - name: Tell Bing about the pages (once a day; never blocks anything)
        if: steps.b.outputs.ok == '1'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ "$(date -u +%H)" = "13" ] && [ "$(date -u +%M)" -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python indexnow.py
          else
            echo "Not this run's turn."
          fi
