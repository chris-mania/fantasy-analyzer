name: Autonomous Weekly Fantasy Refresh

# All cron times are UTC. Window: Tuesday 5 AM ET (after Monday Night Football) through Sunday 1 PM ET (kickoff).
# GitHub drops or delays scheduled runs, especially at :00 and :30, so this fires every 15 minutes at odd
# minutes. If a run is skipped, the next one picks up the same data. A run already in progress is never cancelled.
on:
  schedule:
    - cron: '7,22,37,52 9-23 * * 2'
    - cron: '7,22,37,52 * * * 3-6'
    - cron: '7,22,37,52 0-17 * * 0'
  workflow_dispatch:

concurrency:
  group: fantasy-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Build Script (retries if the data source hiccups)
        env:
          SGO_KEY: ${{ secrets.SGO_KEY }}
        run: |
          python build.py || (sleep 45 && python build.py) || (sleep 90 && python build.py)

      - name: Check the page is real before publishing
        run: |
          test -s public/index.html
          size=$(wc -c < public/index.html)
          echo "index.html is $size bytes"
          test "$size" -gt 300000

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
