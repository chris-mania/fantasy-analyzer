name: Autonomous Weekly Fantasy Refresh

on:
  schedule:
    # All times are UTC. GitHub can start a run a few minutes late.
    # Tuesday from 9:00 UTC (5 AM ET, after Monday Night Football) through Saturday: every 30 minutes
    - cron: '*/30 9-23 * * 2'
    - cron: '*/30 * * * 3-6'
  workflow_dispatch:

# If a run is still going when the next one starts, skip the old one
concurrency:
  group: fantasy-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Build Script
        run: |
          python build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
