name: Autonomous Weekly Fantasy Refresh

on:
  schedule:
    # Tuesday 9:00 UTC: full weekly refresh after Monday Night Football
    - cron: '0 9 * * 2'
    # Wednesday to Saturday, every 6 hours: pick up new injury reports
    - cron: '0 3,9,15,21 * * 3-6'
    # Sunday morning, last updates before the 1:00 PM ET kickoffs
    - cron: '0 9,15 * * 0'
    - cron: '30 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Build Script
        run: |
          python build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
