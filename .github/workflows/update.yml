name: Autonomous Weekly Fantasy Refresh

# All cron times are UTC. Window: Tuesday 5 AM ET (after Monday Night Football) through Sunday 1 PM ET (kickoff).
# GitHub drops or delays scheduled runs, especially at :00 and :30, so this fires every 15 minutes at odd
# minutes. If a run is skipped, the next one picks up the same data. A run already in progress is never cancelled.
on:
  schedule:
    - cron: '7,22,37,52 9-23 * * 2'
    - cron: '7,22,37,52 * * * 3-6'
    - cron: '7,22,37,52 0-17 * * 0'
  workflow_dispatch:

concurrency:
  group: fantasy-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Build Script (retries if the data source hiccups)
        env:
          SGO_KEY: ${{ secrets.SGO_KEY }}
          REQUIRE_SCHEDULE: '1'
        run: |
          python build.py || (sleep 45 && python build.py) || (sleep 90 && python build.py)

      - name: Add the domain move, Google tags, robots.txt and sitemap (keep this step)
        run: python site_extras.py

      - name: Player and rankings pages for Google (about once an hour; keep this step)
        # Makes no API calls: it only reads the page build.py just made. If it fails or it isn't
        # its turn, the last published pages are kept and the site still publishes normally.
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if [ "$(date -u +%M)" -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install playwright==1.63.0 && python -m playwright install --with-deps chromium && python seo_pages.py
          else
            echo "Not this run's turn; keeping the last player pages."
          fi
          if [ ! -d public/players ]; then
            git fetch --depth 1 origin gh-pages && git archive FETCH_HEAD players rankings a sitemap.xml | tar -x -C public || echo "No earlier player pages to keep."
          fi

      - name: Check the page is real before publishing
        run: |
          test -s public/index.html
          size=$(wc -c < public/index.html)
          echo "index.html is $size bytes"
          test "$size" -gt 300000

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true   # keep only the latest published copy so the branch doesn't grow with every update
