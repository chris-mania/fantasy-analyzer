<style>
body{margin:0;background:#0d1118;color:#eaf0fb;font-family:Barlow,system-ui,sans-serif;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px}
.ctl{max-width:1080px;margin:0 auto 12px;display:grid;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row b{font:700 12px Barlow;letter-spacing:.12em;color:#93a0b6;text-transform:uppercase;min-width:56px}
.ctl button{font:700 14px Barlow;border:1px solid #263044;background:#161c27;color:#eaf0fb;padding:9px 14px;border-radius:999px}
.ctl button.on{background:#0a63ff;border-color:#0a63ff}
.clean .ctl{display:none}
.msg{max-width:1080px;margin:0 auto;color:#93a0b6;font-size:13px}
.fit{max-width:1080px;margin:0 auto;overflow:hidden}
.b{width:1080px;height:1350px;transform-origin:0 0;position:relative;overflow:hidden;font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif}
.b *{box-sizing:border-box}
.it{font-style:italic;font-weight:900}
.b{background:linear-gradient(180deg,#fff,#eaf0fb);color:#0b0f17}
.rows{position:absolute;left:34px;top:392px;width:690px;display:grid;gap:6px}
.r{height:64px;background:#fff;border-radius:6px;box-shadow:0 2px 8px #0a1f5a22;display:grid;grid-template-columns:96px 84px 70px 1fr 130px;align-items:center;overflow:hidden}
.n{height:100%;background:linear-gradient(135deg,#0a63ff,#0647c4);color:#fff;font:900 italic 40px 'Barlow Condensed';display:grid;place-items:center;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.nm{font:800 26px 'Barlow Condensed';text-transform:uppercase;line-height:1;white-space:nowrap}.sb{font:600 18px Barlow;color:#5b6678}
.pj{text-align:center;border-left:2px solid #d7deea;line-height:1;padding:0 12px 0 14px}.pj small{display:block;font:700 12px Barlow;color:#5b6678;margin-top:2px}.pj b{display:block;font:900 italic 32px 'Barlow Condensed';color:#0a63ff;line-height:.95}
.gb{height:6px;border-radius:4px;background:#d9e4dc;margin-top:3px;overflow:hidden}.gb i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#1ea85d,#5dffa6);box-shadow:0 0 10px #37c979}
.hd2{position:relative;width:84px;height:64px;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 70%,#dbe6fb,#f4f7fd 75%)}.hd2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;image-rendering:auto}
.hd2 svg{width:100%;height:100%}
.lg{display:grid;place-items:center;height:48px}.lg img{max-width:52px;max-height:48px;object-fit:contain}
.lg.big{grid-column:2/4}.lg.dl{height:60px}.lg.dl img{max-width:96px;max-height:56px}
.deco{position:absolute;right:0;top:330px;width:340px;height:900px;background:linear-gradient(160deg,#0a63ff22,#0a63ff08);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%)}
.deco:before{content:"";position:absolute;right:0;top:0;width:160px;height:100%;background:linear-gradient(180deg,#0a63ff,#0647c4);clip-path:polygon(60% 0,100% 0,100% 100%,0 100%);opacity:.9}
.deco:after{content:"";position:absolute;left:46px;bottom:60px;width:130px;height:12px;background:#0a63ff;transform:skewX(-30deg)}
.foot{position:absolute;left:34px;right:34px;bottom:26px;height:62px;display:flex;font:800 italic 26px 'Barlow Condensed';text-transform:uppercase}
.foot .l{flex:1;background:#0b0f17;color:#fff;display:flex;align-items:center;padding-left:24px;clip-path:polygon(0 0,100% 0,97% 100%,0 100%)}.foot .rr{width:370px;background:#0a63ff;color:#fff;display:grid;place-items:center;font-size:32px;margin-left:-14px;clip-path:polygon(4% 0,100% 0,100% 100%,0 100%)}
</style></head><body>
